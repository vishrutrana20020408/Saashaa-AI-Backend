# ===============================
# LOAD LOCAL ENVIRONMENT FILES
# ===============================
# Load the workspace .env file so local runs pick up POSTGRES_* settings.
spring.config.import=optional:file:../../.env[.properties]

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8081}
server.servlet.context-path=/

# ===============================
# DATABASE CONFIGURATION (Supabase / PostgreSQL)
# ===============================
# Use a Supabase host, database, user, and password from environment variables.
# Do not expose these values in frontend code.
# For Supabase, use POSTGRES_SSLMODE=require unless your endpoint is configured differently.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:db.sfskrgihwnnpsqtxbutv.supabase.co}:5432/${POSTGRES_DB:postgres}?sslmode=${POSTGRES_SSLMODE:require}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pooling for PostgreSQL
spring.datasource.hikari.pool-name=SupabaseHikariCP
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.auto-commit=false

# JPA / HIBERNATE CONFIGURATION
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# JWT CONFIGURATION - Using environment variables for security
# ===============================
app.jwt.secret=${JWT_SECRET:THIS_IS_A_VERY_LONG_RANDOM_SECRET_KEY_1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc.datasource=INFO

# Latest project update:
# Helpful service-level logging for resume/profile/tailoring modules
logging.level.backend.ai_interview=DEBUG

# ===============================
# CORS / WEB - Using environment variables
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://saashaa-ai-frontend.vercel.app,http://localhost:3000,http://127.0.0.1:3000}

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Latest project update:
# Resume storage / generated asset configuration
app.resume.storage.root=${APP_RESUME_STORAGE_ROOT:uploads/resumes}
app.resume.storage.original-dir=original
app.resume.storage.generated-dir=generated
app.resume.storage.preview-dir=preview
app.resume.storage.temp-dir=temp
app.resume.storage.public-prefix=${APP_RESUME_PUBLIC_PREFIX:/uploads/resumes}
app.resume.encryption.key=${RESUME_ENCRYPTION_KEY:}

# Profile Document Storage
app.storage.root=${APP_STORAGE_ROOT:uploads}

# ===============================
# JSON CONFIGURATION
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ===============================
# ACTUATOR / HEALTH CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ===============================
# CAPTCHA CONFIGURATION
# ===============================
app.captcha.enabled=${APP_CAPTCHA_ENABLED:false}
app.captcha.turnstile.secret=${APP_CAPTCHA_TURNSTILE_SECRET:}
app.captcha.turnstile.verify-url=${APP_CAPTCHA_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

# ===============================
# AI ENGINE CONFIGURATION - Using environment variables
# ===============================
ai.engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
ai.engine.connect-timeout-ms=${AI_ENGINE_CONNECT_TIMEOUT_MS:5000}
ai.engine.read-timeout-ms=${AI_ENGINE_READ_TIMEOUT_MS:120000}

