# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
server.servlet.context-path=/

# ===============================
# DATABASE CONFIGURATION (MySQL) - Using environment variables for security
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:ai_interview}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:Pawankumar@15}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# IMPORTANT:
# Keep update during active development so latest project entities
# for resume/profile/version/tailoring modules stay synchronized.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Optional: usually Hibernate can detect dialect automatically with MySQL 8+
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT CONFIGURATION - Using environment variables for security
# ===============================
app.jwt.secret=${JWT_SECRET:THIS_IS_A_VERY_LONG_RANDOM_SECRET_KEY_1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc.datasource=INFO

# Latest project update:
# Helpful service-level logging for resume/profile/tailoring modules
logging.level.backend.ai_interview=DEBUG

# ===============================
# CORS / WEB - Using environment variables
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Latest project update:
# Resume storage / generated asset configuration
app.resume.storage.root=${APP_RESUME_STORAGE_ROOT:uploads/resumes}
app.resume.storage.original-dir=original
app.resume.storage.generated-dir=generated
app.resume.storage.preview-dir=preview
app.resume.storage.temp-dir=temp
app.resume.storage.public-prefix=${APP_RESUME_PUBLIC_PREFIX:/uploads/resumes}
app.resume.encryption.key=${RESUME_ENCRYPTION_KEY:}

# Profile Document Storage
app.storage.root=${APP_STORAGE_ROOT:uploads}

# ===============================
# JSON CONFIGURATION
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ===============================
# AI ENGINE CONFIGURATION - Using environment variables
# ===============================
ai.engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
ai.engine.connect-timeout-ms=${AI_ENGINE_CONNECT_TIMEOUT_MS:5000}
ai.engine.read-timeout-ms=${AI_ENGINE_READ_TIMEOUT_MS:120000}

